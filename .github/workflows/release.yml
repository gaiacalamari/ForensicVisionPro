name: Release Windows
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: .\packaging\build_windows.ps1
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/installer/*.exe
            dist/*.zip
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            (Get-Item dist\installer\*.exe) (Get-Item dist\*.zip) dist\SHA256SUMS.txt `
            --title "Forensic Vision Pro $($env:GITHUB_REF_NAME.TrimStart('v'))" --generate-notes
