[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensic-vision-pro"
version = "1.1.0"
description = "Suite desktop di analisi forense per immagini e video"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6", "Pillow>=10.3", "numpy>=1.26", "opencv-python-headless>=4.9", "pillow-heif>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes", "pyinstaller>=6.6"]

[project.gui-scripts]
forensic-vision-pro = "fvp.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
